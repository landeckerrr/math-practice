<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice 0.01 — The Secret of ÷</title>
<link rel="stylesheet" href="tokens.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
  /* Colours and the reset come from tokens.css, linked above. */
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--wash);color:var(--ink);line-height:1.5;padding:16px}
  .shell{max-width:780px;margin:0 auto}
  .bar{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .who{font-size:13px;color:var(--muted)} .who b{color:var(--ink)}
  .code{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green-deep);background:var(--green-soft);padding:3px 9px;border-radius:20px}
  .track{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px;width:100%}
  .track > div{height:100%;background:var(--green);width:0;transition:width .3s}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:14px}
  h1{font-size:24px;font-weight:700;margin-bottom:4px}
  h2{font-size:19px;font-weight:700;margin-bottom:10px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
  .teach{background:var(--gold-soft);border-left:4px solid var(--gold);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px;margin-bottom:18px;white-space:pre-line}
  .extbanner{background:var(--violet-soft);border-left:4px solid var(--violet);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px;margin-bottom:18px}
  .q{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
  .q:first-of-type{border-top:0;padding-top:0;margin-top:0}
  .qnum{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:5px}
  .prompt{font-size:16px;margin-bottom:12px;white-space:pre-line}
  .choices{display:flex;flex-direction:column;gap:8px}
  .choice{border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;cursor:pointer;font-size:15px;background:var(--paper);text-align:left;transition:.12s;font-family:inherit}
  .choice:hover{border-color:var(--green)}
  .choice.sel{border-color:var(--green);background:var(--green-soft);font-weight:600}
  input[type=text]{width:100%;max-width:260px;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:16px;font-family:inherit}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--green)}
  textarea{width:100%;min-height:90px;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;resize:vertical}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
  .keypad{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .key{font-family:inherit;font-size:17px;font-weight:600;line-height:1;background:var(--green-soft);
       border:1.5px solid #bcdcc7;color:var(--green-deep);border-radius:8px;padding:7px 14px;cursor:pointer}
  .key:hover{background:#d5ecdd;border-color:var(--green)}
  .key:active{transform:translateY(1px)}
  .keylab{font-size:11.5px;color:var(--muted);align-self:center;margin-right:2px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
  button{font-family:inherit;font-size:15px;font-weight:600;border-radius:9px;padding:11px 20px;border:1.5px solid transparent;cursor:pointer;transition:.12s}
  .primary{background:var(--green);color:#fff} .primary:hover{background:var(--green-deep)}
  .primary:disabled{background:#a9c9b5;cursor:not-allowed}
  .ghost{background:var(--paper);border-color:var(--line);color:var(--ink)} .ghost:hover{border-color:var(--muted)}
  .spacer{flex:1}
  .savenote{font-size:12.5px;color:var(--green);font-weight:600}
  .slidelist{display:flex;flex-direction:column;gap:8px;margin:16px 0}
  .chip{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;cursor:pointer;background:var(--paper)}
  .chip:hover{border-color:var(--muted)}
  .chip .mark{font-size:18px;width:24px;text-align:center;flex-shrink:0}
  .chip .lbl{flex:1;font-size:14.5px} .chip .cnt{font-size:12px;color:var(--muted)}
  .chip.ok{background:var(--green-soft);border-color:#b7ddc4} .chip.ok .mark{color:var(--green)}
  .chip.bad{background:var(--red-soft);border-color:#f2c3c0} .chip.bad .mark{color:var(--red)}
  .chip.wait{background:var(--gold-soft);border-color:#ecd79a}
  .chip.ext{background:var(--violet-soft);border-color:#cfc2f0} .chip.ext .mark{color:var(--violet)}
  .score{font-size:44px;font-weight:700;line-height:1}
  .scorelab{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
  .err{color:var(--red);font-size:13px;font-weight:600;margin-top:8px}
  .linkish{background:none;border:0;padding:0;color:var(--blue);font-family:inherit;font-size:14px;font-weight:600;text-decoration:underline;cursor:pointer}
  .bigcheck{font-size:56px;text-align:center;margin-bottom:8px}
  .center{text-align:center}
  .hide{display:none}
  code.work{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f4f6f8;padding:2px 5px;border-radius:4px;font-size:14px}
</style>
</head>
<body>
<div class="shell">

  <div id="startScreen" class="card">
    <span class="code" id="startCode"></span>
    <h1 style="margin-top:10px" id="startTitle"></h1>
    <p class="sub" id="startSub"></p>
    <div class="field" id="vipField">
      <label for="vipIn">VIP number</label>
      <input type="text" id="vipIn" inputmode="numeric" maxlength="4" placeholder="3.01" autocomplete="off">
      <div class="hint">Type it either way — 301 or 3.01.</div>
    </div>
    <div id="confirmBox" class="teach hide"></div>
    <div id="resumeNote" class="teach hide"></div>
    <div id="startErr" class="err hide"></div>
    <div class="row">
      <button class="primary" id="lookupBtn">Continue</button>
      <button class="primary hide" id="startBtn">That's me — start</button>
      <button class="linkish hide" id="retryBtn">Not me, try again</button>
    </div>
    <p class="hint" style="margin-top:14px">Your work saves as you go. Stop anytime and come back with the same VIP number.</p>
  </div>

  <div id="practiceScreen" class="hide">
    <div class="bar">
      <div class="who"><b id="barWho"></b> · VIP <span id="barVip"></span></div>
      <span class="code" id="barCode"></span>
      <div class="track"><div id="progressFill"></div></div>
    </div>
    <div class="card" id="slideCard"></div>
    <div class="row" style="margin-top:0">
      <button class="ghost" id="backBtn">← Back</button>
      <button class="primary" id="nextBtn">Next →</button>
      <div class="spacer"></div>
      <span class="savenote" id="saveNote"></span>
      <button class="ghost" id="exitBtn">Save &amp; exit</button>
    </div>
  </div>

  <div id="reviewScreen" class="hide">
    <div class="card">
      <h2>How did you do?</h2>
      <p class="sub">Tap any slide to go back and fix it. Nothing is turned in until you press the button at the bottom.</p>
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px">
        <span class="score" id="scoreNum"></span><span class="scorelab">correct</span>
      </div>
      <div class="slidelist" id="slideList"></div>
      <div class="teach" id="reviewNote"></div>
      <div class="row">
        <button class="ghost" id="reviewBackBtn">← Keep working</button>
        <div class="spacer"></div>
        <button class="primary" id="submitBtn">Turn in to Mr. Landy</button>
      </div>
      <div id="submitErr" class="err hide"></div>
    </div>
  </div>

  <div id="doneScreen" class="hide">
    <div class="card center">
      <div class="bigcheck">✅</div>
      <h2>Turned in!</h2>
      <p class="sub" id="doneSub"></p>
      <div class="teach" style="text-align:left" id="doneDetail"></div>
    </div>
  </div>

</div>

<script src="roster.js"></script>
<script>
/* ==========================================================================
   EDIT ONLY THIS BLOCK TO MAKE A NEW PRACTICE SET.
   Add  extension: true  to a slide and it becomes a bonus slide:
   it still gets graded, but it does NOT count against the student's score.
   ========================================================================== */

const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbzJxzE8FRVF7gA6vPOzcuPAqBF7y_oeBMVpifKrhJ--yGqUfGN-WADMdbX23rCjoY0P/exec"; // ← paste your Apps Script /exec URL here

// Symbol buttons shown under every typed-answer box (they aren't on a keyboard).
// Override per question with  keys:["÷","½"]  or switch them off with  keys:[]
const DEFAULT_KEYS = ["÷"];

const LESSON = {
  code: "0.01",
  title: "The Secret of ÷",
  subtitle: "Unit 0, Lesson 1 · Fractions ARE Division",

  slides: [
    { title: "Warm-up: the big idea",
      teach: "The ÷ symbol is a picture of a fraction. The dots are where the numbers go. So every division problem can be written as a fraction, and every fraction can be written as a division problem.",
      questions: [
        { type:"text", prompt:"Write 3 ÷ 4 as a fraction.", accept:["3/4"], hint:"Type it like this: 3/4" },
        { type:"text", prompt:"Write 5 ÷ 8 as a fraction.", accept:["5/8"] }
      ]},

    { title: "Going the other way",
      questions: [
        { type:"text", prompt:"Write 7/9 as a division problem.", accept:["7÷9","7/9","7 ÷ 9","7 divided by 9"], hint:"You can type ÷ or /" },
        { type:"mc", prompt:"Which of these means the same as 2/5?", choices:["5 ÷ 2","2 ÷ 5","2 × 5","5 − 2"], answer:1 }
      ]},

    { title: "Sharing problems",
      questions: [
        { type:"text", prompt:"4 friends share 3 brownies equally. How much does each friend get? Write your answer as a fraction.", accept:["3/4"] },
        { type:"text", prompt:"5 friends share 2 pizzas equally. How much does each friend get?", accept:["2/5"] },
        { type:"mc", prompt:"8 students share 3 packs of markers. Which expression shows one student's share?", choices:["8 ÷ 3","3 ÷ 8","8 × 3","3 + 8"], answer:1 }
      ]},

    { title: "Bigger than one whole",
      teach: "When the top number is bigger than the bottom number, each person gets MORE than one whole.",
      questions: [
        { type:"text", prompt:"2 friends share 7 empanadas. Write each friend's share as a fraction.", accept:["7/2"] },
        { type:"mc", prompt:"Is 7/2 more or less than 1 whole?", choices:["More than 1","Less than 1","Exactly 1"], answer:0 }
      ]},

    { title: "Mixed practice",
      questions: [
        { type:"text", prompt:"Write 12 ÷ 5 as a fraction.", accept:["12/5"] },
        { type:"text", prompt:"Write 11/4 as a division problem.", accept:["11÷4","11/4","11 ÷ 4","11 divided by 4"] },
        { type:"text", prompt:"Write 9 ÷ 9 as a fraction. Then simplify it.", accept:["1","9/9","1 whole"], hint:"Careful — what happens when the numbers match?" }
      ]},

    { title: "Word problem",
      questions: [
        { type:"mc", prompt:"A recipe uses 5 cups of flour to make 6 loaves of bread. How much flour is in ONE loaf?", choices:["6/5 of a cup","5/6 of a cup","30 cups","11 cups"], answer:1 },
        { type:"text", prompt:"A rope is 9 meters long and gets cut into 4 equal pieces. How long is each piece? Answer as a fraction.", accept:["9/4"] }
      ]},

    { title: "Catch the mistake",
      questions: [
        { type:"mc", prompt:"Matías says 3 ÷ 8 = 8/3. What did he do wrong?", choices:["Nothing — he's right","He flipped the numbers; it should be 3/8","He should have multiplied","He should have subtracted"], answer:1 },
        { type:"mc", prompt:"Emma says 6/6 is less than 1. Is she right?", choices:["Yes, it's a fraction so it's small","No — 6 ÷ 6 = 1, so it equals exactly 1","No — it equals 6","Yes, it equals 1/6"], answer:1 }
      ]},

    { title: "Explain it",
      questions: [
        { type:"written", prompt:"Explain to a 5th grader why 2 ÷ 5 is the same thing as 2/5. Use a picture in words if it helps.", hint:"Mr. Landy reads this one himself — there's no wrong answer, but write at least two sentences." }
      ]},

    { title: "Connect it to decimals",
      extension: true,
      teach: "If a fraction is a division problem, then dividing gives you the decimal. That's why 1/2 = 0.5 — because 1 ÷ 2 = 0.5.",
      questions: [
        { type:"mc", prompt:"Which division problem gives you the decimal for 3/4?", choices:["4 ÷ 3","3 ÷ 4","3 × 4","0.75 ÷ 3"], answer:1 },
        { type:"mc", prompt:"Without calculating: is 7/8 closer to 0, ½, or 1?", choices:["Close to 0","Close to ½","Close to 1"], answer:2 },
        { type:"mc", prompt:"Without calculating: is 2/9 closer to 0, ½, or 1?", choices:["Close to 0","Close to ½","Close to 1"], answer:0 }
      ]},

    { title: "Challenge",
      extension: true,
      questions: [
        { type:"text", prompt:"3 classes share 7 boxes of supplies equally. Write each class's share as a fraction, then say whether it's more or less than 1 box. (Fraction only in the box.)", accept:["7/3"] },
        { type:"mc", prompt:"Which is the LARGEST?", choices:["4 ÷ 9","9 ÷ 4","4/9","1 ÷ 4"], answer:1 }
      ]}
  ]
};

/* ==========================================================================
   ENGINE — nothing below here needs editing.
   ========================================================================== */
const el = id => document.getElementById(id);
/* Identity comes from roster.js — initials only, never a name. */
const S = { vip:null, vipDisplay:"", section:"", teacher:"", initials:"",
            idx:0, answers:{}, submitted:false };

/* greentime:301:0.01 — vip is the integer, setId is the lesson code. */
const keyFor = vip => `greentime:${vip}:${LESSON.code}`;

function save(){
  try{
    localStorage.setItem(keyFor(S.vip), JSON.stringify({
      vip:S.vip, vipDisplay:S.vipDisplay, section:S.section, teacher:S.teacher,
      idx:S.idx, answers:S.answers,
      submitted:S.submitted, saved:new Date().toISOString()
    }));
    flashSaved();
  }catch(e){}
}
function load(vip){
  try{ const raw = localStorage.getItem(keyFor(vip)); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
let flashTimer;
function flashSaved(){
  const n = el('saveNote'); if(!n) return;
  n.textContent = "Saved ✓"; clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>{ n.textContent=""; }, 1600);
}

function normalize(s){
  return String(s).toLowerCase().trim()
    .replace(/,/g,"").replace(/\s+/g,"")
    .replace(/÷/g,"/").replace(/dividedby/g,"/")
    .replace(/remainder/g,"r");
}
function isCorrect(q,val){
  if(q.type === "written") return null;
  if(val === undefined || val === "" || val === null) return false;
  if(q.type === "mc") return Number(val) === q.answer;
  return q.accept.some(a => normalize(a) === normalize(val));
}
const qid = (si,qi) => `s${si}q${qi}`;

function slideStatus(si){
  const sl = LESSON.slides[si];
  let graded=0, right=0, blank=0;
  sl.questions.forEach((q,qi)=>{
    const v = S.answers[qid(si,qi)];
    if(q.type === "written"){ if(!v || !String(v).trim()) blank++; return; }
    graded++;
    if(v === undefined || v === "") blank++;
    else if(isCorrect(q,v)) right++;
  });
  return {graded,right,blank,ext:!!sl.extension};
}
function totals(){
  let g=0,r=0,eg=0,er=0;
  LESSON.slides.forEach((sl,si)=>{
    const st = slideStatus(si);
    if(sl.extension){ eg+=st.graded; er+=st.right; }
    else { g+=st.graded; r+=st.right; }
  });
  return {graded:g,right:r,extGraded:eg,extRight:er};
}

function show(which){
  ['startScreen','practiceScreen','reviewScreen','doneScreen']
    .forEach(id => el(id).classList.toggle('hide', id !== which));
  window.scrollTo(0,0);
}

el('startCode').textContent = "Practice " + LESSON.code;
el('startTitle').textContent = LESSON.title;
el('startSub').textContent = LESSON.subtitle;

/* Whoever we just looked up and are waiting on the student to confirm. */
let pending = null;

/* Allow digits and one dot while typing: "301" and "3.01" both work. */
el('vipIn').addEventListener('input', e=>{
  e.target.value = e.target.value.replace(/[^0-9.]/g,'').slice(0,4);
  el('startErr').classList.add('hide');
});
el('vipIn').addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !el('lookupBtn').classList.contains('hide')) el('lookupBtn').click();
});

function askAgain(){
  pending = null;
  el('confirmBox').classList.add('hide');
  el('resumeNote').classList.add('hide');
  el('startBtn').classList.add('hide');
  el('retryBtn').classList.add('hide');
  el('lookupBtn').classList.remove('hide');
  el('vipField').classList.remove('hide');
  el('vipIn').readOnly = false;
  el('vipIn').value = "";
  el('vipIn').focus();
}

el('lookupBtn').onclick = ()=>{
  const err = el('startErr');
  const r = lookupVip(el('vipIn').value);
  if(!r){
    err.textContent = "That VIP number isn't on my list. Check your card or ask your teacher.";
    err.classList.remove('hide');
    return;
  }
  err.classList.add('hide');
  pending = r;

  el('confirmBox').innerHTML =
    `<b>${escapeHtml(r.display)} — ${escapeHtml(r.initials)}</b>, section ${escapeHtml(r.section)}.<br>Is that you?`;
  el('confirmBox').classList.remove('hide');

  const prev = load(r.vip), note = el('resumeNote');
  if(prev && !prev.submitted){
    note.textContent = `Picking up where you stopped — slide ${prev.idx+1}.`;
    note.classList.remove('hide');
  } else if(prev && prev.submitted){
    note.textContent = `This VIP already turned in Practice ${LESSON.code}. Starting again replaces it.`;
    note.classList.remove('hide');
  } else {
    note.classList.add('hide');
  }

  el('vipIn').readOnly = true;
  el('lookupBtn').classList.add('hide');
  el('startBtn').classList.remove('hide');
  el('retryBtn').classList.remove('hide');
};

el('retryBtn').onclick = askAgain;

el('startBtn').onclick = ()=>{
  if(!pending) return;
  const prev = load(pending.vip);
  if(prev && !prev.submitted){ S.idx = prev.idx; S.answers = prev.answers || {}; }
  S.vip = pending.vip; S.vipDisplay = pending.display;
  S.section = pending.section; S.teacher = pending.teacher;
  S.initials = pending.initials; S.submitted = false;
  el('barWho').textContent = S.initials;
  el('barVip').textContent = S.vipDisplay;
  el('barCode').textContent = "Practice "+LESSON.code;
  show('practiceScreen'); renderSlide();
};

function renderSlide(){
  const si=S.idx, sl=LESSON.slides[si];
  el('progressFill').style.width = (si/LESSON.slides.length*100)+"%";
  const required = LESSON.slides.filter(s=>!s.extension).length;

  let html = `<div class="sub" style="margin-bottom:6px">Slide ${si+1} of ${LESSON.slides.length}</div>`;
  html += `<h2>${escapeHtml(sl.title)}</h2>`;
  const firstExt = LESSON.slides.findIndex(s => s.extension);
  if(sl.extension){
    html += si === firstExt
      ? `<div class="extbanner">🌟 <b>Bonus round.</b> You've finished all ${required} required slides — nice. Nothing from here counts against your score, so swing away.</div>`
      : `<div class="extbanner">🌟 <b>Still bonus.</b> Doesn't count against your score.</div>`;
  }
  if(sl.teach) html += `<div class="teach">${escapeHtml(sl.teach)}</div>`;

  sl.questions.forEach((q,qi)=>{
    const id=qid(si,qi), val=S.answers[id];
    html += `<div class="q"><div class="qnum">QUESTION ${qi+1}</div><div class="prompt">${escapeHtml(q.prompt)}</div>`;
    if(q.type==="mc"){
      html += `<div class="choices">`;
      q.choices.forEach((c,ci)=>{
        html += `<button class="choice ${String(val)===String(ci)?'sel':''}" data-q="${id}" data-c="${ci}">${escapeHtml(c)}</button>`;
      });
      html += `</div>`;
    } else if(q.type==="written"){
      html += `<textarea data-q="${id}" placeholder="Write your answer here...">${escapeHtml(val||"")}</textarea>`;
    } else {
      html += `<input type="text" data-q="${id}" value="${escapeHtml(val||"")}" placeholder="Your answer" autocomplete="off">`;
      const keys = q.keys === undefined ? DEFAULT_KEYS : q.keys;
      if(keys && keys.length){
        html += `<div class="keypad"><span class="keylab">Tap to insert:</span>`;
        keys.forEach(k => { html += `<button class="key" data-ins="${escapeHtml(k)}" data-target="${id}">${escapeHtml(k)}</button>`; });
        html += `</div>`;
      }
    }
    if(q.hint) html += `<div class="hint">💡 ${escapeHtml(q.hint)}</div>`;
    html += `</div>`;
  });
  el('slideCard').innerHTML = html;

  el('slideCard').querySelectorAll('.choice').forEach(b=>{
    b.onclick=()=>{
      S.answers[b.dataset.q]=Number(b.dataset.c);
      b.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); save();
    };
  });
  el('slideCard').querySelectorAll('input[type=text], textarea').forEach(inp=>{
    inp.oninput=()=>{ S.answers[inp.dataset.q]=inp.value; };
    inp.onblur=()=>save();
  });
  el('slideCard').querySelectorAll('.key').forEach(k=>{
    k.onclick=()=>{
      const inp = el('slideCard').querySelector(`input[data-q="${k.dataset.target}"]`);
      if(!inp) return;
      const a = inp.selectionStart ?? inp.value.length;
      const b = inp.selectionEnd   ?? inp.value.length;
      inp.value = inp.value.slice(0,a) + k.dataset.ins + inp.value.slice(b);
      const pos = a + k.dataset.ins.length;
      inp.focus(); inp.setSelectionRange(pos,pos);
      S.answers[inp.dataset.q] = inp.value; save();
    };
  });

  el('backBtn').style.visibility = si===0 ? 'hidden':'visible';
  el('nextBtn').textContent = si===LESSON.slides.length-1 ? "Check my work →" : "Next →";
}

el('backBtn').onclick=()=>{ if(S.idx>0){ S.idx--; save(); renderSlide(); } };
el('nextBtn').onclick=()=>{
  save();
  if(S.idx < LESSON.slides.length-1){ S.idx++; renderSlide(); } else renderReview();
};
el('exitBtn').onclick=()=>{
  save();
  alert(`Saved, ${S.initials}. Come back on this same computer and type VIP ${S.vipDisplay} to pick up where you left off.`);
};

function renderReview(){
  show('reviewScreen');
  const t = totals();
  el('scoreNum').textContent = `${t.right}/${t.graded}`;

  let list="", anyBlank=false;
  LESSON.slides.forEach((sl,si)=>{
    const st=slideStatus(si);
    let cls,mark,note;
    if(sl.extension){
      cls="ext"; mark="🌟";
      note = st.blank>0 ? "bonus — optional" : `${st.right}/${st.graded} bonus correct`;
    } else if(st.blank>0){ cls="wait"; mark="•"; note="not finished"; anyBlank=true; }
    else if(st.graded===0){ cls="wait"; mark="✎"; note="Mr. Landy grades this"; }
    else if(st.right===st.graded){ cls="ok"; mark="✓"; note=`${st.right}/${st.graded} correct`; }
    else { cls="bad"; mark="✗"; note=`${st.right}/${st.graded} correct`; }
    list += `<div class="chip ${cls}" data-go="${si}"><span class="mark">${mark}</span>
      <span class="lbl"><b>Slide ${si+1}</b> — ${escapeHtml(sl.title)}</span>
      <span class="cnt">${note}</span></div>`;
  });
  el('slideList').innerHTML=list;
  el('slideList').querySelectorAll('.chip').forEach(c=>{
    c.onclick=()=>{ S.idx=Number(c.dataset.go); show('practiceScreen'); renderSlide(); };
  });

  el('reviewNote').textContent = anyBlank
    ? "Some questions are still blank. Tap those slides and finish them before you turn in."
    : "Red slides mean something's off. Go fix them — you can change any answer before turning in.";
}
el('reviewBackBtn').onclick=()=>{ show('practiceScreen'); renderSlide(); };

el('submitBtn').onclick = async ()=>{
  const btn=el('submitBtn'); btn.disabled=true; btn.textContent="Sending...";
  const t=totals();
  const payload={
    lesson:LESSON.code, lessonTitle:LESSON.title,
    vip:S.vip, vipDisplay:S.vipDisplay, section:S.section, teacher:S.teacher,
    score:t.right, outOf:t.graded, bonusScore:t.extRight, bonusOutOf:t.extGraded,
    submittedAt:new Date().toISOString(),
    answers: LESSON.slides.flatMap((sl,si)=> sl.questions.map((q,qi)=>({
      q:`${si+1}.${qi+1}`, bonus:!!sl.extension,
      response:S.answers[qid(si,qi)] ?? "",
      correct:isCorrect(q,S.answers[qid(si,qi)])
    })))
  };
  if(SUBMIT_URL){
    try{
      await fetch(SUBMIT_URL,{method:"POST",mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    }catch(e){}
  }
  /* Mark it turned in but KEEP the answers on this machine — if the send
     failed silently (no-cors hides that), the work is still recoverable. */
  S.submitted=true; save();
  el('doneSub').textContent=`Nice work, ${S.initials}.`;
  el('doneDetail').innerHTML =
    `<b>Practice ${LESSON.code} — ${escapeHtml(LESSON.title)}</b><br>
     VIP ${S.vipDisplay} · ${t.right} of ${t.graded} correct` +
     (t.extGraded ? ` · ${t.extRight}/${t.extGraded} bonus` : ``) +
    `<br>Turned in ${new Date().toLocaleString()}`;
  show('doneScreen');
};

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
